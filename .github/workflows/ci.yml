name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check api worker tests scripts
      - run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start tested services
        run: docker compose up --build --detach kafka-init postgres redis api worker
      - name: Wait for readiness
        run: |
          for attempt in {1..90}; do
            curl --fail --silent http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pytest -m integration -v -s
      - name: Benchmark matrix smoke test
        run: |
          python scripts/benchmark_matrix.py \
            --count 100 \
            --concurrency-levels 1,10 \
            --runs 2 \
            --output benchmark-results/ci-matrix.json
      - if: always()
        run: docker compose logs > benchmark-results/compose.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-evidence
          path: benchmark-results/
      - if: always()
        run: docker compose down --volumes
