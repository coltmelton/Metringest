name: Metringest CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests scripts
      - run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: docker compose up --build --detach
      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            curl --fail --silent http://localhost:8001/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pytest -m integration
      - name: Run benchmark smoke test
        run: python scripts/benchmark_ingest.py --count 100 --concurrency 10 --output benchmark-results/ci.json
      - if: always()
        run: docker compose logs > compose.log
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metringest-integration-evidence
          path: |
            compose.log
            benchmark-results/
      - if: always()
        run: docker compose down --volumes
