[project]
name = "metringest"
version = "0.1.0"
description = "A small metrics ingestion pipeline and operations dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "aiokafka>=0.11,<1",
  "redis>=5,<7",
  "asyncpg>=0.29,<1",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

