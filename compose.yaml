services:
  api:
    build: .
    ports: ["${API_PORT:-8001}:8000"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://metringest:metringest@postgres:5432/metringest
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
      WORKER_BATCH_WAIT_MS: ${WORKER_BATCH_WAIT_MS:-250}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://metringest:metringest@postgres:5432/metringest
    depends_on:
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  simulator:
    build: .
    command: ["python", "-m", "app.simulator"]
    profiles: ["simulation"]
    environment:
      SIMULATOR_API_URL: http://api:8000/v1/metrics
      SIMULATOR_EVENT_COUNT: ${SIMULATOR_EVENT_COUNT:-2500}
    depends_on:
      api: {condition: service_started}

  kafka:
    image: apache/kafka:3.9.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
    volumes: ["redis-data:/data"]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metringest
      POSTGRES_USER: metringest
      POSTGRES_PASSWORD: metringest
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U metringest"], interval: 5s, timeout: 3s, retries: 10}
    volumes: ["postgres-data:/var/lib/postgresql/data"]

volumes:
  redis-data:
  postgres-data:
